{% extends "base.html" %}
{% block title %}Change password{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Change password</h1>
    <div class="subtitle">Signed in as {{ g.user['username'] }}</div>
  </div>
</div>

<form method="post" class="panel" style="padding: 24px; max-width: 560px;">
  <div class="field">
    <label for="current">Current password</label>
    <input type="password" id="current" name="current" autocomplete="current-password" required autofocus>
  </div>
  <div class="field">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
  </div>
  <div class="field">
    <label for="confirm">New password again</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Change password</button>
    <a href="{{ url_for('dashboard.index') }}" class="btn">Cancel</a>
  </div>
</form>
{% endblock %}
