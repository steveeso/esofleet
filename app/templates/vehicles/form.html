{% extends "base.html" %}
{% block title %}{{ 'Add vehicle' if mode == 'new' else 'Edit vehicle' }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>{{ 'Add vehicle' if mode == 'new' else 'Edit ' + vehicle.get('unit_number', '') }}</h1>
  </div>
</div>

<form method="post" class="panel" style="padding: 24px;">
  <div class="form-grid">
    <div class="field">
      <label for="unit_number">Unit number *</label>
      <input type="text" id="unit_number" name="unit_number" value="{{ vehicle.get('unit_number', '') }}" required>
    </div>
    <div class="field">
      <label for="status">Status</label>
      <select id="status" name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {{ 'selected' if vehicle.get('status', 'active') == s }}>{{ s|replace('_', ' ')|capitalize }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="make">Make *</label>
      <input type="text" id="make" name="make" value="{{ vehicle.get('make', '') }}" required>
    </div>
    <div class="field">
      <label for="model">Model *</label>
      <input type="text" id="model" name="model" value="{{ vehicle.get('model', '') }}" required>
    </div>

    <div class="field">
      <label for="year">Year</label>
      <input type="number" id="year" name="year" value="{{ vehicle.get('year', '') }}" min="1950" max="2100">
    </div>
    <div class="field">
      <label for="mileage">Current mileage</label>
      <input type="number" id="mileage" name="mileage" value="{{ vehicle.get('mileage', 0) }}" min="0">
    </div>

    <div class="field">
      <label for="vin">VIN</label>
      <input type="text" id="vin" name="vin" value="{{ vehicle.get('vin', '') or '' }}">
    </div>
    <div class="field">
      <label for="license_plate">License plate</label>
      <input type="text" id="license_plate" name="license_plate" value="{{ vehicle.get('license_plate', '') or '' }}">
    </div>

    <div class="field">
      <label for="assigned_driver">Assigned driver</label>
      <input type="text" id="assigned_driver" name="assigned_driver" value="{{ vehicle.get('assigned_driver', '') or '' }}">
    </div>
    <div></div>

    <div class="field full">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes">{{ vehicle.get('notes', '') or '' }}</textarea>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">{{ 'Add vehicle' if mode == 'new' else 'Save changes' }}</button>
    <a href="{{ url_for('vehicles.detail', vehicle_id=vehicle['id']) if mode == 'edit' else url_for('vehicles.list_vehicles') }}" class="btn">Cancel</a>
  </div>
</form>
{% endblock %}
